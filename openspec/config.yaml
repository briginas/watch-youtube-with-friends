schema: product-refined

context: |
  Проект: Watch Youtube with friends — Chrome-расширение для совместного просмотра на YouTube.
  Пиши документы по-русски; сохраняй технические заголовки и ключевые слова формата OpenSpec.
  Продукт и границы: PRD.md. Архитектурные решения: docs/adr/. Процесс: docs/development.md.
  Стек: WXT, TypeScript, React, CSS Modules; Shadow DOM для UI на странице; Zod для данных.
  Firebase RTDB и Anonymous Auth предварительно выбраны, подтверждаются прототипом.
  Проверки: Vitest, Playwright, Firebase Emulator Suite и ручные проверки реального YouTube.
  Общие действия: play/pause, seek, скорость; громкость, качество и субтитры — личные.
  Вход по приглашению без форм. Комната продолжает работу после выхода создателя.
  Основная неизвестность — адаптер обычного плеера YouTube и жизненный цикл RTDB в MV3.
  Текущее изменение готовит прототип для двух независимых браузерных профилей.
  Основные specs описывают завершённые изменения; до реализации требования хранятся в change.
  Не считай наблюдение на mock-плеере подтверждением работы реального YouTube.

rules:
  proposal:
    - Указывай границы прототипа и связь с PRD; не расширяй MVP без явного решения.
  specs:
    - Описывай наблюдаемое поведение с SHALL/MUST и Scenario WHEN/THEN.
    - Не подменяй требования списком библиотек или внутренних модулей.
  design:
    - Отмечай проверяемые гипотезы и условия пересмотра; не выдавай их за проверенные решения.
  tasks:
    - У каждой задачи должен быть проверяемый результат; проверки добавляй рядом с реализацией.
    - Незавершённые эксперименты и ручные проверки сохраняй открытыми.
