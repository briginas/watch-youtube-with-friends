<!doctype html>
<html lang="ru">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Сессия совместного просмотра</title></head>
  <body>
    <main id="room-panel" aria-label="Комната совместного просмотра">
      <div id="room-dock">
        <button id="room-toggle" aria-expanded="false" aria-controls="room-details">
          <img class="dock-icon" src="/icon/128.png" alt="" draggable="false">
          <span class="dock-content">
            <span class="heading">
              <span class="sync-dot" aria-hidden="true"><span class="buffering-spinner"></span></span>
              <span id="room-name">Комната</span>
              <span id="participant-count" title="Участники">
                <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2m20 0v-2a4 4 0 0 0-3-3.9M16 3.1a4 4 0 0 1 0 7.8"/><circle cx="9" cy="7" r="4"/></svg>
                <span class="sr-only">Участников: </span><span id="participant-number">—</span>
              </span>
              <svg id="chevron" aria-hidden="true" viewBox="0 0 24 24"><path d="m6 15 6-6 6 6"/></svg>
            </span>
            <span class="summary"><span id="status" role="status" aria-live="off">Подключаемся…</span><span id="problem" hidden>Требуется внимание</span></span>
          </span>
        </button>
        <button id="copy-invitation" aria-label="Копировать приглашение" title="Копировать приглашение" disabled>
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M10 13.5a4 4 0 0 0 5.7 0l4.2-4.2a4 4 0 0 0-5.7-5.7l-2.4 2.4m2.2 4.5a4 4 0 0 0-5.7 0l-4.2 4.2a4 4 0 0 0 5.7 5.7l2.4-2.4"/></svg>
        </button>
        <button id="notice-open" aria-label="Показать сообщение" title="Показать сообщение" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/></svg>
        </button>
      </div>
      <div id="room-details" hidden>
        <div class="details-heading">
          <img class="details-icon" src="/icon/128.png" alt="" draggable="false">
          <div class="details-title">
            <h1 id="full-room-name"></h1>
            <p id="synced-status" hidden>Смотрим вместе</p>
          </div>
        </div>
        <p id="player-status" hidden></p>
        <a id="return-video" target="_top" hidden>Вернуться в комнату</a>
        <button id="switch-video" hidden>Смотреть это в комнате</button>
        <div id="participants-slot"><section id="participants" hidden></section></div>
        <button id="leave" class="leave" hidden>Выйти из комнаты</button>
      </div>
      <span id="announcement" class="sr-only" aria-live="polite"></span>
    </main>
    <aside id="room-notice" aria-labelledby="notice-title" hidden>
      <header class="notice-heading">
        <svg id="notice-icon" aria-hidden="true" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v6m0 4h.01"/></svg>
        <h2 id="notice-title">Требуется внимание</h2>
        <button id="notice-close" aria-label="Закрыть сообщение" title="Закрыть сообщение"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button>
      </header>
      <div id="notice-content">
        <p id="connection-status"></p>
        <p id="action-status"></p>
        <p id="switch-status"></p>
        <p id="catalog-status" hidden></p>
        <p id="copy-status"></p>
        <button id="retry" hidden>Повторить подключение</button>
        <button id="stop-recovery" hidden>Остановить попытки</button>
        <button id="catalog-retry" hidden>Повторить сохранение</button>
        <label id="manual-invitation" hidden>Ссылка-приглашение<input id="invitation-link" aria-label="Ссылка-приглашение" aria-describedby="copy-status" readonly></label>
      </div>
    </aside>
    <script type="module" src="../session/main.ts"></script>
  </body>
</html>
